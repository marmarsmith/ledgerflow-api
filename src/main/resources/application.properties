spring.application.name=ledgerflow

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ledgerflow_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=3600


# Recurring transaction scheduler
ledgerflow.recurring.cron=${LEDGERFLOW_RECURRING_CRON:0 0 1 * * *}
ledgerflow.recurring.zone=${LEDGERFLOW_RECURRING_ZONE:UTC}
