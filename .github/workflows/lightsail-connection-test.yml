
name: Test Lightsail SSH Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-connection:
    name: Verify Lightsail Connection
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/tally-deploy
          chmod 600 ~/.ssh/tally-deploy

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH and Docker access
        env:
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST }}
        run: |
          ssh \
            -i ~/.ssh/tally-deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            ubuntu@"$LIGHTSAIL_HOST" \
            'echo "SSH connection successful"; sudo -n docker ps --format "table {{.Names}}\t{{.Status}}"'
