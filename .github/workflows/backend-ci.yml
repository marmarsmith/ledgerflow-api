
name: Tally Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tally-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven verification
        run: mvn -B clean verify

  publish:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy:
    name: Deploy to AWS Lightsail
    runs-on: ubuntu-latest
    needs: publish

    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    environment: production

    concurrency:
      group: tally-production-deployment
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/tally-deploy
          chmod 600 ~/.ssh/tally-deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment configuration
        env:
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST }}
        run: |
          test -f deploy/compose.prod.yaml

          scp \
            -i ~/.ssh/tally-deploy \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            deploy/compose.prod.yaml \
            ubuntu@"$LIGHTSAIL_HOST":/opt/tally/compose.prod.yaml.pending

      - name: Deploy and verify application
        env:
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST }}
          IMAGE: ghcr.io/marmarsmith/ledgerflow-api:sha-${{ github.sha }}
        run: |
          ssh \
            -i ~/.ssh/tally-deploy \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            ubuntu@"$LIGHTSAIL_HOST" \
            "bash -se" -- "$IMAGE" <<'REMOTE'
          set -Eeuo pipefail

          IMAGE="$1"
          cd /opt/tally

          COMPOSE=(sudo -n docker compose
            -p tally
            --env-file /opt/tally/.env
            -f /opt/tally/compose.prod.yaml)

          echo "Validating pending production configuration..."
          sudo -n docker compose \
            -p tally \
            --env-file /opt/tally/.env \
            -f /opt/tally/compose.prod.yaml.pending \
            config --quiet

          PREVIOUS_IMAGE="$(sudo -n docker inspect \
            --format '{{.Config.Image}}' tally-api-1)"

          echo "Backing up current configuration..."
          cp compose.prod.yaml compose.prod.yaml.backup

          rollback() {
            echo "Deployment failed. Attempting rollback..."

            cp compose.prod.yaml.backup compose.prod.yaml

            if sudo -n env TALLY_IMAGE="$PREVIOUS_IMAGE" \
              docker compose \
              -p tally \
              --env-file /opt/tally/.env \
              -f /opt/tally/compose.prod.yaml \
              up -d --no-deps api; then
              echo "Previous API configuration restored."
            else
              echo "WARNING: Automatic rollback failed."
            fi
          }

          trap rollback ERR

          echo "Activating production configuration..."
          mv compose.prod.yaml.pending compose.prod.yaml

          echo "Pulling new API image..."
          sudo -n env TALLY_IMAGE="$IMAGE" \
            docker compose \
            -p tally \
            --env-file /opt/tally/.env \
            -f /opt/tally/compose.prod.yaml \
            pull api

          echo "Updating API container..."
          sudo -n env TALLY_IMAGE="$IMAGE" \
            docker compose \
            -p tally \
            --env-file /opt/tally/.env \
            -f /opt/tally/compose.prod.yaml \
            up -d --no-deps api

          echo "Waiting for application startup..."

          READY=false

          for attempt in $(seq 1 30); do
            HTTP_STATUS="$(curl -s \
              -o /dev/null \
              -w '%{http_code}' \
              http://127.0.0.1:8081/api/accounts || true)"

            if [ "$HTTP_STATUS" = "401" ]; then
              READY=true
              break
            fi

            echo "Attempt $attempt/30: HTTP $HTTP_STATUS"
            sleep 5
          done

          if [ "$READY" != "true" ]; then
            echo "ERROR: API readiness verification failed."
            false
          fi

          echo "Verifying deployed image..."

          ACTUAL_IMAGE="$(sudo -n docker inspect \
            --format '{{.Config.Image}}' tally-api-1)"

          if [ "$ACTUAL_IMAGE" != "$IMAGE" ]; then
            echo "ERROR: Unexpected deployed image."
            false
          fi

          trap - ERR

          echo "Deployment successful!"
          echo "Image: $ACTUAL_IMAGE"

          "${COMPOSE[@]}" ps
          REMOTE
  
